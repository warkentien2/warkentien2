name: Validate
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Record navigation evidence with existing Playwright stories
        run: npm run evidence:ux -- --name ci-navigation
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            artifacts/evidence/
          retention-days: 14
