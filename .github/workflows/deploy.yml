name: Deploy static portfolio
# Deliberately manual until the redesigned portfolio is ready to launch.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify Pages publishes the built artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pages_build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type)"
          if [ "$pages_build_type" != "workflow" ]; then
            echo "::error::Pages must use GitHub Actions. Open Settings > Pages > Build and deployment > Source and select GitHub Actions. Do not publish master from /(root): that serves README.md instead of the built site."
            exit 1
          fi
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5.0.1
